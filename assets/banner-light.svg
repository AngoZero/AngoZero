  <text x="78" y="146" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-1" fill="#0A1628">Djillali Adair</text>
  <text x="80" y="190" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#4C6180">Diseño y construyo software de punta a punta.</text>

  <rect x="80" y="222" width="28" height="2" fill="#BF5722" />
  <text x="122" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2.6" fill="#4C6180">PRODUCTO · BACKEND · FRONTEND · iOS · INFRAESTRUCTURA</text>
</svg>
