  <rect width="1200" height="300" fill="#F4F1EC" />
  <rect x="640" y="0" width="560" height="300" fill="url(#dots)" opacity="0.14" mask="url(#fademask)" />
  <rect x="0" y="296" width="1200" height="4" fill="#BF5722" />

  <text x="1006" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="3.2" fill="#BF5722">@ANGOZERO</text>

