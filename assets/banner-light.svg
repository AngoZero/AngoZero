<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Djillali Adair — diseño y construyo software de punta a punta">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#0A1628" />
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" />
      <stop offset="1" stop-color="#FFFFFF" />
    </linearGradient>
    <mask id="fademask">
      <rect x="640" y="0" width="560" height="300" fill="url(#fade)" />
